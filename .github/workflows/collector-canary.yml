name: Collector canary

# Live verification is point-in-time: these five bank pages will change, and a
# broken collector reports FAILED rather than wrong numbers -- but only if
# something is actually running it. This job exists to notice breakage.
#
# Deliberately NOT part of CI: it reaches live bank websites, so it must never
# gate a pull request. It is also not a history store -- durable observation
# history accrues locally via deploy/scheduling/ (see docs/pricing_intelligence.md).
# This job collects into a throwaway database and reports only whether each
# collector still parses its page -- once per product, because the home-loan
# and term-deposit pages are different pages with different parsers, and a
# term-deposit regression is otherwise invisible (the workflow defaults to
# home loans).
#
# Before assuming a red run means a parser regression, read "Known
# Limitations" in docs/competitor_rate_ingestion.md: ASB, Westpac, Kiwibank,
# and intermittently BNZ show failure signatures consistent with bot
# mitigation (Akamai) reacting to this runner's shared IP range, not parser
# bugs -- confirmed 2026-09-18 by reproducing (or failing to reproduce) the
# same fetch from other networks. Re-running this workflow repeatedly to
# chase that down is likely to make it worse, not better.

on:
  schedule:
    # GitHub evaluates schedule cron in UTC only -- it has no IANA timezone
    # support, so this cannot track NZ daylight saving. 19:30 UTC is 07:30
    # NZST (UTC+12); during NZDT (UTC+13, roughly late Sep-early Apr) it
    # drifts to 08:30 local. Accepted for a non-gating canary.
    #
    # The weekday field is evaluated in UTC too: NZST is 12h ahead, so a
    # local Monday 07:30 falls on UTC Sunday 19:30 -- the *previous* UTC
    # calendar day. To land on NZ local Mon-Fri, the UTC cron day-of-week
    # must be Sun-Thu (0-4), not Mon-Fri (1-5) -- 1-5 here previously ran
    # NZ local Tue-Sat, skipping the Monday-morning canary entirely.
    - cron: "30 19 * * 0-4"
  workflow_dispatch:

# Never run more than one canary at a time.
concurrency:
  group: collector-canary
  cancel-in-progress: false

jobs:
  canary:
    name: canary (${{ matrix.product }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      # One product's breakage must not cancel or hide the other's result, and the
      # two run one after the other so each bank sees one request at a time.
      fail-fast: false
      max-parallel: 1
      matrix:
        product: [home_loan, term_deposit]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install package with browser extra
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -e ".[browser]"

      - name: Install Chromium
        run: python -m playwright install --with-deps chromium

      - name: Collect live rates
        id: collect
        # Exit 2 (partial failure) must not be swallowed, but we still want the
        # summary uploaded, so the code is captured rather than failing here.
        run: |
          set +e
          python scripts/collect_market_rates_workflow.py \
            --product "${{ matrix.product }}" \
            --render-javascript \
            --database "${RUNNER_TEMP}/canary.db" \
            --lock-file "${RUNNER_TEMP}/canary.lock" \
            --summary-file "${RUNNER_TEMP}/summary.json"
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"

      - name: Upload run summary
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: collection-summary-${{ matrix.product }}
          path: ${{ runner.temp }}/summary.json
          if-no-files-found: warn

      - name: Per-bank results
        if: always()
        run: |
          python - "${RUNNER_TEMP}/summary.json" >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import json, sys
          try:
              summary = json.load(open(sys.argv[1], encoding="utf-8"))
          except (OSError, ValueError):
              print("No run summary was written.")
              raise SystemExit(0)
          errors = {f.get("bank"): f.get("error_type", "") for f in summary.get("failures") or []}
          print(f"### {summary.get('product_type')}: per-bank collection")
          print("| Bank | Result | Error type |")
          print("|---|---|---|")
          for bank in summary.get("banks_succeeded") or []:
              print(f"| {bank} | SUCCESS | |")
          for bank in summary.get("banks_failed") or []:
              print(f"| {bank} | FAILED | {errors.get(bank, '')} |")
          print(f"\nRates accepted: {summary.get('rates_accepted')}, "
                f"rejected: {summary.get('rates_rejected')}")
          PY

      - name: Report collector health
        run: |
          CODE="${{ steps.collect.outputs.exit_code }}"
          case "$CODE" in
            0) echo "All five ${{ matrix.product }} collectors parsed their live pages." ;;
            2) echo "::error::Collection is incomplete - inspect the uploaded run summary." ;;
            1) echo "::error::No collector succeeded. Live collection is broken." ;;
            3) echo "::error::Lock held unexpectedly in a fresh runner." ;;
            *) echo "::error::Unexpected exit code $CODE" ;;
          esac
          # The summary has already been uploaded. Partial collection must
          # remain visible as a failed health check for unattended monitoring.
          [ "$CODE" = "0" ] && exit 0
          exit 1
