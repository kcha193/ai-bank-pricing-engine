[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-bank-pricing-engine"
version = "0.1.0"
description = "Synthetic retail bank balance sheet pricing engine for home loans and term deposits."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "joblib>=1.4",
    "numpy>=1.26,<2.0",
    "pandas>=2.1",
    "pydantic>=2.5",
    "pyyaml>=6.0",
    "scikit-learn>=1.4",
]

[project.optional-dependencies]
dev = [
    "ipykernel>=6.29",
    "notebook>=7.0",
    "matplotlib>=3.8",
    "hypothesis>=6.100",
    "pytest>=8.0",
    "pytest-cov>=6.0",
    "ruff>=0.8",
]
dashboard = ["streamlit>=1.30"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "live_rates: opt-in tests that fetch current official bank rate pages",
]

[tool.ruff]
line-length = 100
target-version = "py39"
exclude = ["notebooks/"]
