name: My Local Setup
version: 0.0.1
schema: v1

models:
  # Chat model (for Q&A, code help)
  - name: LM Studio Chat
    provider: lmstudio
    model: qwen/qwen3.6-27b
    roles:
      - chat

  # Autocomplete model (fast, lightweight)
  - name: LM Studio Autocomplete
    provider: lmstudio
    model: qwen/qwen3.5-9b
    roles:
      - autocomplete